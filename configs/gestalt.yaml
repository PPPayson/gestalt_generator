# Benchmark from the friend's gestalt silhouettes. Run:  python run.py configs/gestalt.yaml
name: gestalt_demo

# Gestalt silhouettes come from main.py's output in data/silhouettes/.
#   mode: existing    -> sample N of the already-generated silhouettes (seeded)
#   mode: regenerate  -> run main.generate(...) first, then sample N
silhouettes:
  - type: gestalt
    params:
      mode: existing        # existing | regenerate
      n: 20                 # how many silhouettes to dress
      seed: 0               # reproducible random selection
      # src_dir: data/silhouettes   # override pool location if needed
      # regenerate: {n_vs: [4, 5, 6], rs: [0.4, 0.8]}   # subset grid when mode: regenerate

pairs:
  source: catalog
  n_per_silhouette: 6
  filter: {natural: null, min_contrast: 0.25, objects: null}
  explicit: []

assets:
  best_of: 3

dress:
  backends: [composite]     # composite (local) and/or controlnet (Modal)
  modes: [perfect]
  shadow: 55

select:
  round_min: 0.55
  contrast_high: 0.22
  contrast_low_natural: 0.10

output:
  contact_sheet: true
